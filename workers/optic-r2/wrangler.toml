# OPTIC photo storage on Cloudflare R2 (replaces the Supabase `team-photos`
# bucket for /optic + /lukeupload uploads). R2 has zero egress fees, which is
# the whole point: every parent scrolling the feed was billed against the
# Supabase egress quota. Deploy: see ./README.md.
name = "optic-photos"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "optic-photos"

[vars]
# Browser origins allowed to PUT/DELETE, comma-separated, or "*". GETs are
# always open (public photos). Left at "*" for comp day so a preview deploy
# or a www/non-www mismatch can't silently break parent uploads; tighten to
# "https://www.sdhsjrotc.com,https://sdhsjrotc.com" once things are calm.
ALLOWED_ORIGINS = "*"
# Used to verify a DISPATCH login before a DELETE. The anon key is public
# (it already ships in the site bundle) and RLS-protected, so it lives here.
# NEVER put the service_role key in this file.
SUPABASE_URL = "https://bjgyvmdzcymruunzavni.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqZ3l2bWR6Y3ltcnV1bnphdm5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NjMxMTQsImV4cCI6MjA5MzEzOTExNH0.HsRE4RreQU6yZSYxoYtvsC615e-EBpIIeDTC50EW0Cs"
